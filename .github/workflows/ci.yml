
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_user -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://expense_user:ci_test_password@localhost:5432/expense_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://expense_user:ci_test_password@localhost:5432/expense_tracker_test
      SECRET_KEY: "ci-only-not-for-production-0123456789abcdef0123456789abcdefh52t5jh2tbg87v845gbjv87gu5bfgdfg87r332vhgvsd9rg35ggn323345h4d89b8th"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Apply database migrations
        run: uv run alembic -x test=true upgrade head

      - name: Verify migration downgrade and re-upgrade
        run: |
          uv run alembic -x test=true downgrade 9bcc9b2f41dd
          uv run alembic -x test=true upgrade head

      - name: Check code with Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Build Docker image
        run: docker build --tag expense-tracker-api:ci .

      - name: Smoke test Docker container
        shell: bash
        run: |
          set -euo pipefail

          container_name=expense-tracker-api-smoke

          cleanup() {
            status=$?
            trap - EXIT

            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" || true
            fi

            docker rm -f "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --network host \
            --env "DATABASE_URL=$DATABASE_URL" \
            --env "SECRET_KEY=$SECRET_KEY" \
            --env "APP_ENV=production" \
            expense-tracker-api:ci

          for attempt in $(seq 1 30); do
            if response=$(curl --silent --fail \
              http://127.0.0.1:8000/health); then
              echo "Health endpoint response: $response"

              if [ "$response" = '{"status":"ok"}' ]; then
                echo "Docker container smoke test passed."
                exit 0
              fi
            fi

            sleep 1
          done

          echo "Container failed to become healthy within 30 seconds." >&2
          exit 1
