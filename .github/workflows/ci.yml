
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_user -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://expense_user:ci_test_password@localhost:5432/expense_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://expense_user:ci_test_password@localhost:5432/expense_tracker_test
      SECRET_KEY: "ci-only-not-for-production-0123456789abcdef0123456789abcdef"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Apply database migrations
        run: uv run alembic -x test=true upgrade head

      - name: Check code with Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q
